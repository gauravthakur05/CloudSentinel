version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: cloudsentinel-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cloudsentinel-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/cloudsentinel
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_before_any_real_use}
      JWT_EXPIRES_IN: 8h
      LOG_GENERATOR_INTERVAL_MS: 2000
      LOG_GENERATOR_ENABLED: "true"
      CORS_ORIGIN: http://localhost:5173

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: cloudsentinel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  mongo_data:
